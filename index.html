<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2024~현재 언론보도 스크랩북 — 서울시50플러스재단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --surface2: #f0ede6;
  --ink: #1a1814;
  --ink2: #5a5650;
  --ink3: #9a9590;
  --accent: #c8401a;
  --accent-light: #fdf0ec;
  --border: #e2ddd6;
  --border2: #ccc8c0;
  --serif: 'Noto Serif KR', serif;
  --sans: 'Noto Sans KR', sans-serif;
  --radius: 6px;
  --radius-lg: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Header ── */
.site-header {
  background: var(--ink);
  color: #fff;
  padding: 2.5rem 2rem 2rem;
  border-bottom: 3px solid var(--accent);
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}
.header-brand small {
  display: block;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.header-brand h1 {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
  color: #fff;
}
.header-brand h1 em {
  font-style: normal;
  color: #f0a882;
}
.header-stats {
  display: flex;
  gap: 1.5rem;
}
.hstat {
  text-align: right;
}
.hstat-num {
  display: block;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  color: #fff;
}
.hstat-label {
  display: block;
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.06em;
}
.btn-export {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 18px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: var(--radius);
  color: #fff;
  font-size: 13px;
  font-family: var(--sans);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s;
  align-self: center;
}
.btn-export:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.5); }

/* ── Main layout ── */
.main {
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem;
}

/* ── Controls ── */
.controls {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
}
.controls-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink3);
  pointer-events: none;
}
.search-wrap input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 13px;
  background: var(--bg);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: var(--accent); }
select {
  padding: 9px 12px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 13px;
  background: var(--bg);
  color: var(--ink);
  outline: none;
  cursor: pointer;
}
select:focus { border-color: var(--accent); }

/* ── Category pills ── */
.cats {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.cat-pill {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--ink2);
  font-family: var(--sans);
  transition: all 0.15s;
  white-space: nowrap;
}
.cat-pill:hover { border-color: var(--accent); color: var(--accent); }
.cat-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Results bar ── */
.results-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: 8px;
}
.results-count {
  font-size: 13px;
  color: var(--ink2);
}
.results-count strong { color: var(--ink); font-weight: 500; }

/* ── Article grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

/* ── Article card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  display: flex;
  flex-direction: column;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  border-color: var(--border2);
}
.card-img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink3);
  font-size: 12px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}
.card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card-img-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: var(--ink3);
}
.card-img-placeholder svg { opacity: 0.4; }
.card-img-placeholder span { font-size: 11px; }
.card-img .img-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s;
}
.card:hover .img-overlay { opacity: 1; }
.img-overlay svg { color: #fff; }

.card-body {
  padding: 14px 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 3px;
  letter-spacing: 0.02em;
  align-self: flex-start;
}
.card-title {
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--ink);
  flex: 1;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink3);
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.card-media { font-weight: 500; color: var(--ink2); }

/* ── Modal ── */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(20,18,16,0.82);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  max-width: 760px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { transform: translateY(12px) scale(0.98); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
  gap: 1rem;
}
.modal-header-info {}
.modal-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 3px;
  margin-bottom: 8px;
}
.modal-title {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--ink);
}
.modal-close {
  background: none;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  width: 32px;
  height: 32px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink2);
  flex-shrink: 0;
  transition: all 0.15s;
}
.modal-close:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
.modal-meta {
  padding: 10px 1.5rem;
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--ink2);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.modal-meta span { display: flex; align-items: center; gap: 5px; }
.modal-img-wrap {
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.modal-img {
  width: 100%;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: block;
}
.no-img-msg {
  background: var(--surface2);
  border: 1px dashed var(--border2);
  border-radius: var(--radius);
  padding: 2.5rem;
  text-align: center;
  color: var(--ink3);
  font-size: 13px;
}
.modal-img-input-row {
  display: flex;
  gap: 8px;
}
.modal-img-input-row input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  outline: none;
}
.modal-img-input-row input:focus { border-color: var(--accent); }
.btn-save {
  padding: 8px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--sans);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.btn-save:hover { opacity: 0.88; }
.modal-footer {
  padding: 1rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 8px;
}
.btn-outline {
  padding: 7px 14px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--sans);
  background: transparent;
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger {
  padding: 7px 14px;
  border: 1px solid #f0a0a0;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--sans);
  background: transparent;
  color: #c0302a;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-danger:hover { background: #fff0f0; }

/* ── Add article panel ── */
.add-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-top: 2rem;
  overflow: hidden;
}
.add-panel-header {
  padding: 1rem 1.5rem;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}
.add-panel-header:hover { background: #e8e4dc; }
.add-panel-body {
  padding: 1.5rem;
  display: none;
}
.add-panel-body.open { display: block; }
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.form-grid input, .form-grid select {
  padding: 9px 12px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  width: 100%;
  outline: none;
}
.form-grid input:focus, .form-grid select:focus { border-color: var(--accent); }
.form-full { margin-bottom: 12px; }
.form-full input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  outline: none;
}
.form-full input:focus { border-color: var(--accent); }

/* ── Card upload button ── */
.card-upload-btn {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(255,255,255,0.92);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 4px 9px;
  font-size: 11px;
  font-family: var(--sans);
  font-weight: 500;
  color: var(--ink2);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s, background 0.15s;
  z-index: 10;
  white-space: nowrap;
}
.card:hover .card-upload-btn { opacity: 1; }
.card-upload-btn:hover { background: #fff; color: var(--accent); border-color: var(--accent); }
.card-img-placeholder .upload-hint-btn {
  margin-top: 6px;
  padding: 5px 12px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  font-size: 11px;
  font-family: var(--sans);
  font-weight: 500;
  color: var(--ink2);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.card-img-placeholder .upload-hint-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Empty ── */
.empty {
  text-align: center;
  padding: 3rem;
  color: var(--ink3);
  font-size: 14px;
  grid-column: 1 / -1;
}

/* ── Footer ── */
footer {
  text-align: center;
  padding: 2rem;
  font-size: 12px;
  color: var(--ink3);
  border-top: 1px solid var(--border);
  margin-top: 3rem;
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-brand">
      <small>서울시50플러스재단 · 언론홍보</small>
      <h1>2024~<span id="currentYear"></span>년 사업별 주요<br><em>언론 보도 스크랩북</em></h1>
    </div>
    <div style="display:flex;align-items:center;gap:1.5rem;">
      <div class="header-stats" id="headerStats"></div>
      <button class="btn-export" onclick="exportHTML()" title="이미지가 내장된 HTML 파일로 저장 → 사내 서버에 올리면 누구든 열람 가능">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        HTML 내보내기
      </button>
    </div>
  </div>
</header>

<main class="main">
  <div class="controls">
    <div class="controls-row">
      <div class="search-wrap">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="기사 제목, 매체명 검색…" oninput="render()">
      </div>
      <select id="mediaFilter" onchange="render()"><option value="">매체 전체</option></select>
      <select id="yearFilter" onchange="render()">
        <option value="">연도 전체</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>
    </div>
    <div class="cats" id="catPills"></div>
  </div>

  <div class="results-bar">
    <div class="results-count" id="resultsCount"></div>
  </div>

  <div class="grid" id="grid"></div>

  <!-- Add panel -->
  <div class="add-panel">
    <div class="add-panel-header" onclick="toggleAdd()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      새 기사 추가
      <span id="addChevron" style="margin-left:auto;font-size:12px;color:var(--ink3)">▼</span>
    </div>
    <div class="add-panel-body" id="addBody">
      <div class="form-grid">
        <input type="text" id="nTitle" placeholder="기사 제목 *">
        <input type="text" id="nMedia" placeholder="매체명 *">
        <input type="text" id="nDate" placeholder="날짜 (예: 2025.6.10)">
        <select id="nCat">
          <option value="">카테고리 선택 *</option>
          <option>기관 소개 및 성과</option><option>중장년 정책</option>
          <option>경력설계 상담</option><option>경력인재지원사업</option>
          <option>채용박람회·설명회</option><option>취업훈련</option>
          <option>서울시 중장년 일자리박람회</option><option>가치동행일자리</option>
          <option>창업지원</option><option>40대직업캠프</option>
          <option>서울시니어일자리지원센터</option><option>중장년취업사관학교</option><option>기타</option>
        </select>
      </div>
      <div class="form-full">
        <input type="text" id="nImg" placeholder="지면 이미지 URL (선택 — 구글드라이브·사내 서버 등 직접 링크)">
      </div>
      <div class="form-full">
        <input type="text" id="nUrl" placeholder="원문 기사 URL (선택)">
      </div>
      <button class="btn-save" onclick="addArticle()">추가하기</button>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-header-info">
        <span class="modal-badge" id="mBadge"></span>
        <div class="modal-title" id="mTitle"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()" aria-label="닫기">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-meta" id="mMeta"></div>
    <div class="modal-img-wrap">
      <div id="mImgArea"></div>
      <div class="modal-img-input-row" style="flex-wrap:wrap;gap:8px;">
        <label style="display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-family:var(--sans);font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border2)';this.style.color='var(--ink2)'">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          파일에서 업로드
          <input type="file" id="mImgFile" accept="image/*" style="display:none" onchange="loadImgFile(this)">
        </label>
        <input type="text" id="mImgInput" placeholder="또는 이미지 URL 직접 입력" style="flex:1;min-width:160px;">
        <button class="btn-save" onclick="saveImg()">저장</button>
      </div>
    </div>
    <div class="modal-footer">

let nextId = 55;
let activeCat = '전체';
let openId = null;

// ── localStorage 저장/불러오기 ──
const STORAGE_KEY = 'scrapbook50plus_images';

function saveToStorage() {
  try {
    // 이미지(img)와 추가 기사만 저장 (용량 절약)
    const data = {
      images: {},       // id → img
      added: [],        // 새로 추가된 기사 (id >= 55)
      nextId: nextId
    };
    articles.forEach(a => {
      if (a.img) data.images[a.id] = a.img;
      if (a.id >= 55) data.added.push(a);
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    console.warn('저장 실패 (용량 초과 가능성):', e);
    alert('이미지 저장에 실패했습니다. 이미지 파일 용량이 너무 클 수 있습니다.');
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    // 기존 기사에 이미지 복원
    if (data.images) {
      articles.forEach(a => {
        if (data.images[a.id]) a.img = data.images[a.id];
      });
    }
    // 추가된 기사 복원
    if (data.added && data.added.length) {
      data.added.forEach(a => {
        if (!articles.find(x => x.id === a.id)) articles.push(a);
      });
    }
    if (data.nextId) nextId = data.nextId;
  } catch(e) {
    console.warn('불러오기 실패:', e);
  }
}

loadFromStorage();

function getCatColor(cat) {
  return CAT_COLORS[cat] || {bg:'#f1f5f9',fg:'#475569'};
}

function filtered() {
  const s = document.getElementById('searchInput').value.trim();
  const m = document.getElementById('mediaFilter').value;
  const y = document.getElementById('yearFilter').value;
  return articles.filter(a => {
    const catOk = activeCat === '전체' || a.cat === activeCat;
    const sOk = !s || a.title.includes(s) || a.media.includes(s);
    const mOk = !m || a.media === m;
    const yOk = !y || a.date.startsWith(y);
    return catOk && sOk && mOk && yOk;
  });
}

function buildMediaOptions() {
  const sel = document.getElementById('mediaFilter');
  const cur = sel.value;
  while (sel.options.length > 1) sel.remove(1);
  [...new Set(articles.map(a=>a.media))].sort().forEach(m => {
    const o = new Option(m, m);
    sel.appendChild(o);
  });
  sel.value = cur;
}

function renderStats() {
  const total = articles.length;
  const cats = new Set(articles.map(a=>a.cat)).size;
  const medias = new Set(articles.map(a=>a.media)).size;
  document.getElementById('headerStats').innerHTML =
    `<div class="hstat"><span class="hstat-num">${total}</span><span class="hstat-label">총 기사</span></div>
     <div class="hstat"><span class="hstat-num">${cats}</span><span class="hstat-label">사업분야</span></div>
     <div class="hstat"><span class="hstat-num">${medias}</span><span class="hstat-label">매체</span></div>`;
}

function renderPills() {
  const counts = {};
  articles.forEach(a => counts[a.cat] = (counts[a.cat]||0)+1);
  const cats = ['전체', ...Object.keys(CAT_COLORS)];
  document.getElementById('catPills').innerHTML = cats.map(c => {
    const cnt = c === '전체' ? articles.length : (counts[c]||0);
    return `<button class="cat-pill${activeCat===c?' active':''}" onclick="setCat('${c}')">${c} ${cnt}</button>`;
  }).join('');
}

             <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
             교체
             <input type="file" accept="image/*" style="display:none" onchange="uploadCardImg(event,${a.id})">
           </label>
         </div>`
      : `<div class="card-img">
           <div class="card-img-placeholder">
             <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
             <label class="upload-hint-btn" onclick="event.stopPropagation()">
               <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
               이미지 업로드
               <input type="file" accept="image/*" style="display:none" onchange="uploadCardImg(event,${a.id})">
             </label>
           </div>
         </div>`;
    return `<div class="card" onclick="openModal(${a.id})">
      ${imgHtml}
      <div class="card-body">
        <span class="card-badge" style="background:${col.bg};color:${col.fg}">${a.cat}</span>
        <div class="card-title">${a.title}</div>
        <div class="card-meta">
          <span class="card-media">${a.media}</span>
          <span>·</span>
          <span>${a.date}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function render() { renderStats(); renderPills(); renderGrid(); }

function setCat(cat) { activeCat = cat; render(); }

function openModal(id) {
  const a = articles.find(x=>x.id===id);
  if (!a) return;
  openId = id;
  const col = getCatColor(a.cat);
  document.getElementById('mBadge').textContent = a.cat;
  document.getElementById('mBadge').style.background = col.bg;
  document.getElementById('mBadge').style.color = col.fg;
  document.getElementById('mTitle').textContent = a.title;
  document.getElementById('mMeta').innerHTML =
    `<span><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0"><path d="M4 4h16v16H4z" rx="2"/><path d="M16 2v4M8 2v4M4 10h16"/></svg>${a.date}</span>
     <span><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/></svg>${a.media}</span>`;
  document.getElementById('mImgInput').value = a.img || '';
  document.getElementById('mImgArea').innerHTML = a.img
    ? `<img class="modal-img" src="${a.img}" alt="지면 이미지">`
    : `<div class="no-img-msg">아직 지면 이미지가 없습니다.<br>아래에 이미지 URL을 입력하고 저장하면 카드에 표시됩니다.</div>`;
  const urlBtn = document.getElementById('mUrlBtn');
  if (a.url) { urlBtn.style.display=''; } else { urlBtn.style.display='none'; }
  document.getElementById('modalBackdrop').classList.add('open');
}

function saveImg() {
  const url = document.getElementById('mImgInput').value.trim();
  const a = articles.find(x=>x.id===openId);
  if (!a) return;
  a.img = url;
  document.getElementById('mImgArea').innerHTML = url
    ? `<img class="modal-img" src="${url}" alt="지면 이미지">`
    : `<div class="no-img-msg">이미지가 삭제되었습니다.</div>`;
  saveToStorage();
  render();
}

// 카드에서 직접 파일 업로드
function uploadCardImg(event, id) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const a = articles.find(x=>x.id===id);
    if (!a) return;
    a.img = e.target.result;
    saveToStorage();
    render();
  };
  reader.readAsDataURL(file);
}

// 모달에서 파일 선택 시 URL 인풋에 반영
function loadImgFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('mImgInput').value = '';
    const a = articles.find(x=>x.id===openId);
    if (!a) return;
    a.img = e.target.result;
    document.getElementById('mImgArea').innerHTML =
      `<img class="modal-img" src="${e.target.result}" alt="지면 이미지">`;
    saveToStorage();
    render();
  };
  reader.readAsDataURL(file);
}

function openUrl() {
  const a = articles.find(x=>x.id===openId);
  if (a && a.url) window.open(a.url, '_blank');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalBackdrop')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalBackdrop').classList.remove('open');
  openId = null;
}

function deleteArticle() {
  if (!openId) return;
  if (!confirm('이 기사를 삭제할까요?')) return;
  articles = articles.filter(x=>x.id!==openId);
  saveToStorage();
  closeModalDirect();
  buildMediaOptions();
  render();
}

function toggleAdd() {
  const body = document.getElementById('addBody');
  const chev = document.getElementById('addChevron');
  body.classList.toggle('open');
  chev.textContent = body.classList.contains('open') ? '▲' : '▼';
}

function addArticle() {
  const title = document.getElementById('nTitle').value.trim();
  const media = document.getElementById('nMedia').value.trim();
  const date  = document.getElementById('nDate').value.trim();
  const cat   = document.getElementById('nCat').value;
  const img   = document.getElementById('nImg').value.trim();
  const url   = document.getElementById('nUrl').value.trim();
  if (!title || !media || !cat) { alert('제목, 매체명, 카테고리는 필수입니다.'); return; }
  articles.unshift({id:nextId++, cat, media, date:date||'날짜 미입력', title, img, url});
  ['nTitle','nMedia','nDate','nImg','nUrl'].forEach(id => document.getElementById(id).value='');
  document.getElementById('nCat').value='';
  saveToStorage();
  buildMediaOptions();
  render();
}

document.addEventListener('keydown', e => { if (e.key==='Escape') closeModalDirect(); });

// ── HTML 내보내기 ──
function exportHTML() {
  // 현재 HTML 소스를 가져와서 articles 배열 부분만 교체
  const src = document.documentElement.outerHTML;

  // 현재 articles 데이터를 JSON으로 직렬화
  const articlesJson = JSON.stringify(articles, null, 2);
  const nextIdVal = nextId;

  // 원본 소스에서 "let articles = [" ~ "];" 블록을 현재 데이터로 교체
  const updated = src.replace(
    /let articles = \[[\s\S]*?\];\s*\nlet nextId = \d+;/,
    `let articles = ${articlesJson};\nlet nextId = ${nextIdVal};`
  );

  const blob = new Blob([updated], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const today = new Date();
  const dateStr = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  a.download = `scrapbook_50plus_${dateStr}.html`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// 현재 연도 자동 표시
const yr = new Date().getFullYear();
document.getElementById('currentYear').textContent = yr;

buildMediaOptions();
render();
</script>
</body>
